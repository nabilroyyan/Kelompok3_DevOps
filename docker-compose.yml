# =============================================================================
# Axon DSS — orkestrasi runtime (Tugas 1, 2, 3 peran Infrastructure Engineer)
#
# RINGKASAN DESAIN
#   Hanya service `proxy` (Nginx) yang memiliki published port. Service `app`
#   (php-fpm) dan `db` (MySQL) berada di network `axon-network` dengan
#   `internal: true`, sehingga keduanya TIDAK dapat dijangkau dari host maupun
#   dari internet. Ini implementasi langsung dari:
#     - T-05 (database terekspos)      -> 02-exposure-control.md 2.1
#     - T-10 (privilege container)     -> semua container non-root
#     - T-09/T-08 (DoS)                -> limit_req + batas resource
#
#   Hak akses user database turut dibatasi menjadi SELECT saja; lihat
#   docker/db/20-app-user-privileges.sh (arahan PO, least privilege).
#
# CARA PAKAI
#   cp .env.example .env    # lalu isi password & APP_KEY
#   bash scripts/up.sh      # otomatis: APP_KEY, sertifikat, build, up
#
# CATATAN: berkas ini tidak mengubah kode aplikasi milik Developer; seluruh
# konfigurasi bersifat runtime/orchestration.
# =============================================================================

name: axon-dss

services:
  # ---------------------------------------------------------------------------
  # Database MySQL — TIDAK ada `ports` (Zero Tolerance T-05)
  # ---------------------------------------------------------------------------
  db:
    image: mysql:26.7
    restart: unless-stopped

    # Semua nilai diambil dari .env. Tidak ada kredensial literal di berkas ini
    # (aturan T-06 + pemeriksaan otomatis pada Gate 4).
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-classicmodels}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD wajib diisi di .env}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME wajib diisi di .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}
      TZ: UTC

    volumes:
      # Data persisten; `down -v` menghapus volume ini (perintah reset).
      - db-data:/var/lib/mysql
      # Skema + data `classicmodels` milik Developer, dipasang READ-ONLY.
      # Tidak ada penyalinan/penulisan balik ke berkas Developer.
      # (Berkas ini adalah dump MySQL, bukan PostgreSQL.)
      - ./database/axon-postgresql.sql:/docker-entrypoint-initdb.d/10-classicmodels.sql:ro
      # Dijalankan SETELAH impor skema (urutan angka 10 lalu 20) untuk mencabut
      # hak berlebih user aplikasi sehingga tersisa SELECT saja, sesuai
      # docs/PO/1.1. Architecture.md (Data Tier, least privilege).
      # Read-only dan tanpa password literal (T-06).
      - ./docker/db/20-app-user-privileges.sh:/docker-entrypoint-initdb.d/20-app-user-privileges.sh:ro

    networks:
      - axon-network

    security_opt:
      - no-new-privileges:true

    # `start_period` longgar karena container harus menyelesaikan inisialisasi
    # basis data + impor data sebelum menerima koneksi.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

    # MySQL diberi waktu untuk flush sebelum dihentikan paksa.
    stop_grace_period: 30s

    # Batas resource: mitigasi kelelahan resource (T-08).
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

    # Retensi log container (03-logging-minimum 3.4) supaya disk host tidak penuh.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Backend Laravel (php-fpm) — TIDAK ada `ports`
  # ---------------------------------------------------------------------------
  app:
    build:
      # Context adalah root repositori karena Infra menempatkan artefaknya
      # langsung di root (docker-compose.yml, docker/, scripts/).
      context: .
      dockerfile: docker/app/Dockerfile
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      APP_ENV: ${APP_ENV:-production}
      # T-07: pesan error verbose tidak boleh sampai ke client.
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?APP_KEY wajib diisi di .env}
      APP_URL: ${APP_URL:-https://localhost}
      APP_TIMEZONE: UTC

      # LOG-2: log aplikasi dikirim ke stderr container, bukan ditulis ke
      # filesystem container (yang bersifat read-only).
      LOG_CHANNEL: stack
      LOG_STACK: stderr
      LOG_LEVEL: ${LOG_LEVEL:-warning}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE:-classicmodels}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME wajib diisi di .env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}

      # TLS-8: cookie sesi hanya lewat HTTPS.
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}

      # Dashboard ini read-only: tidak ada antrean, cache cukup di berkas.
      QUEUE_CONNECTION: sync
      CACHE_STORE: file
      MAIL_MAILER: log

    # Tidak dipublikasikan, hanya dijangkau proxy lewat network privat (TLS-6).
    expose:
      - "9000"

    networks:
      - axon-network

    # T-10 + prinsip least privilege: non-root (USER www-data di Dockerfile),
    # tanpa capability tambahan, dan filesystem root read-only.
    read_only: true
    tmpfs:
      # /tmp perlu ditulis oleh sesi PHP/sistem.
      - /tmp:size=32m,mode=1777
      # Laravel menulis manifest paket & cache ke bootstrap/cache pada runtime.
      # Isi image di-hide oleh tmpfs, jadi direktori ini harus writable.
      - /var/www/html/bootstrap/cache:size=16m,mode=1777
    volumes:
      # storage/ (framework cache, views, sessions, logs) memakai named volume
      # supaya container tetap read-only namun Laravel tetap bisa menulis.
      # Docker mewarisi kepemilikan dari image, sehingga www-data tetap pemilik.
      - app-storage:/var/www/html/storage

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      # Cukup membuktikan php-fpm menerima koneksi pada port 9000.
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Reverse proxy + penyaji frontend (Nginx) — SATU-SATUNYA pintu masuk
  # ---------------------------------------------------------------------------
  proxy:
    build:
      context: .
      dockerfile: docker/proxy/Dockerfile
      args:
        # Dibuat relatif agar browser memanggil API pada origin yang sama.
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped

    depends_on:
      app:
        condition: service_healthy

    # Pemetaan port publik. Container Nginx sendiri mendengarkan 8080/8443
    # karena berjalan sebagai non-root (T-10); host tetap 80/443 seperti biasa.
    #
    # PUBLISH_ADDR memungkinkan dua skenario:
    #   - "0.0.0.0"  (default) : container menjadi pintu masuk publik.
    #   - "127.0.0.1"          : hanya dapat dijangkau Nginx host, untuk kasus
    #     Nginx di host yang menangani sertifikat CA tepercaya (lihat panduan).
    ports:
      - "${PUBLISH_ADDR:-0.0.0.0}:${HTTP_PORT:-80}:8080"
      - "${PUBLISH_ADDR:-0.0.0.0}:${HTTPS_PORT:-443}:8443"

    volumes:
      # Sertifikat TLS development (TLS-5). Read-only dan TIDAK di-commit.
      - ./certs:/etc/nginx/certs:ro

    # `axon-public`  -> dapat diakses dari luar (hanya proxy yang tersambung)
    # `axon-network` -> jalur ke `app`; network privat tanpa akses keluar
    networks:
      - axon-public
      - axon-network

    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/cache/nginx:size=32m,mode=1777

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  db-data:
  app-storage:

networks:
  # Jaringan luar: hanya `proxy` yang tersambung.
  axon-public:
    driver: bridge
  # Jaringan privat antar container aplikasi.
  # `internal: true` = tidak ada rute keluar/masuk dari host maupun internet,
  # sehingga database tidak mungkin diekspos meski konfigurasi app salah (T-05).
  # Nama `axon-network` mengikuti arahan Product Owner pada
  # docs/PO/2.1 Developer Analysis Result.md bagian 6.
  axon-network:
    driver: bridge
    internal: true
