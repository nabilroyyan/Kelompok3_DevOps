# Trivy — Gate CRITICAL (SCA dan Container). Issue #5: FAIL jika ada Critical.
# PO 1.2 Risk.md: CVE Critical = ZERO TOLERANCE (0). Build dibatalkan, wajib remedi/patch < 24 jam.
# Tidak ada pengecualian untuk Critical (file ini sengaja tanpa `ignorefile`).
# Ancaman TM v1: T-11 (supply chain), T-10 (container). Aset: A-06.
#
# Pemakaian (dari root repo):
#   trivy fs    --config policy/trivy.yaml app
#   trivy image --config policy/trivy.yaml axon-dss-app

format: table
exit-code: 1              # pipeline gagal bila ada temuan CRITICAL
severity:
  - CRITICAL
scanners:
  - vuln
ignore-unfixed: false     # Critical tanpa patch tetap memblokir; solusi: ganti base image/versi paket
timeout: 10m
