# Security Gate (draf, belum aktif) — Issue #5, Milestone 3.
# Aktivasi: salin ke .github/workflows/security-gate.yml.
# Tidak butuh secret tambahan (GITHUB_TOKEN bawaan sudah cukup).
# Sebelum produksi: pin versi action ke commit SHA dan image ke digest (mitigasi T-11).
# Seluruh path relatif terhadap root repo, sesuai struktur root repositori.

name: security-gate

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: security-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  POLICY_DIR: policy
  APP_DIR: app
  COMPOSE_FILE: docker-compose.yml

jobs:
  # ---- Gate 1: Secret Scanning — Zero Tolerance ----
  secret-scan:
    name: Gate 1 - Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # pindai seluruh riwayat commit, bukan hanya HEAD
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect \
            --source /repo --config "/repo/$POLICY_DIR/gitleaks.toml" \
            --redact --verbose --exit-code 1 \
            --report-format sarif --report-path /repo/gitleaks.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore

  # ---- Gate 2: SCA dependensi (T-11) — Critical = 0 (High hanya dilaporkan) ----
  sca-dependencies:
    name: Gate 2 - SCA (Trivy fs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/setup-trivy@v0.2.2
      - name: Critical (tanpa pengecualian)
        run: trivy fs --config "$POLICY_DIR/trivy.yaml" "$APP_DIR"
      - name: High/Medium/Low (tidak memblokir, untuk backlog)
        if: always()
        run: trivy fs --scanners vuln --severity HIGH,MEDIUM,LOW --exit-code 0 --format json --output trivy-backlog.json "$APP_DIR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sca-backlog
          path: trivy-backlog.json
          if-no-files-found: ignore

  # ---- Gate 3: Kebijakan container (T-05, T-06, T-10) — root/port DB/secret = Zero Tolerance ----
  container-policy:
    name: Gate 3 - Container Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml
      - name: Cek non-root, port database, secret literal (dari root repo)
        run: bash "$POLICY_DIR/scripts/check-infra-policy.sh" "$COMPOSE_FILE"
      # Guard T-02 membaca app/ dan routes/ relatif terhadap direktori kerja,
      # sehingga harus dijalankan dari root backend agar kode Developer terperiksa.
      - name: Guard SQL Injection (T-02) pada kode backend
        working-directory: app/backend
        run: bash "$GITHUB_WORKSPACE/$POLICY_DIR/scripts/check-infra-policy.sh" "$GITHUB_WORKSPACE/$COMPOSE_FILE"

  # ---- Gate 4: Container image scan (T-10, T-11) ----
  image-scan:
    name: Gate 4 - Container Image Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [secret-scan, container-policy]
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/setup-trivy@v0.2.2
      - name: Nilai env untuk build (acak, bukan secret)
        run: |
          {
            echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "DB_USERNAME=axon"
            echo "APP_KEY=base64:$(openssl rand -base64 32)"
          } >> "$GITHUB_ENV"
      - name: Build image (app dan proxy) dan pull image database
        run: |
          docker compose -f "$COMPOSE_FILE" build
          docker compose -f "$COMPOSE_FILE" pull db
      - name: Scan seluruh image (Critical)
        run: |
          rc=0
          for img in $(docker compose -f "$COMPOSE_FILE" config --images); do
            echo "== $img"
            trivy image --config "$POLICY_DIR/trivy.yaml" "$img" || rc=1
          done
          exit $rc

  # ---- Gate 5: SAST (Semgrep) — SQL Injection dan pola kode berbahaya ----
  # NON-BLOCKING pada run pertama (continue-on-error). Lihat hasilnya dulu; bila
  # sudah bersih atau temuan palsu sudah ditangani, hapus baris continue-on-error
  # agar menjadi gate yang memblokir. Hanya temuan berseverity ERROR yang dihitung.
  sast-semgrep:
    name: Gate 5 - SAST (Semgrep)
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        run: >
          semgrep scan --metrics=off --error --severity ERROR
          --config p/php --config p/javascript --config p/owasp-top-ten
          --exclude vendor --exclude node_modules
          "$APP_DIR"

  # ---- Ringkasan: satu status wajib untuk branch protection ----
  security-gate-passed:
    name: Security Gate - PASSED
    runs-on: ubuntu-latest
    needs: [secret-scan, sca-dependencies, container-policy, image-scan, sast-semgrep]
    steps:
      - run: echo "Seluruh Security Gate lulus."
