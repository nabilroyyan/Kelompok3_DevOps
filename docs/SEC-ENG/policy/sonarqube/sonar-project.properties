# SonarQube - konfigurasi analisis SAST untuk Laravel (PHP) + Bootstrap 5 (HTML/Blade/JS/CSS)
# Ancaman TM v1: T-02 (SQL Injection), T-06 (hardcoded credential), T-07 (verbose error).
# SONAR_HOST_URL dan SONAR_TOKEN diberikan lewat GitHub Secrets, JANGAN ditulis di file ini.

sonar.projectKey=axon-dss-dashboard
sonar.projectName=Axon DSS Dashboard
sonar.sourceEncoding=UTF-8

# Struktur standar Laravel
sonar.sources=app,routes,resources,config,database,public
sonar.tests=tests
sonar.exclusions=vendor/**,node_modules/**,storage/**,bootstrap/cache/**,public/build/**,public/vendor/**,**/*.min.js,**/*.min.css,database/**/*.sql
sonar.coverage.exclusions=tests/**,database/**,config/**,routes/**,resources/views/**

# Coverage PHPUnit (clover). Dihasilkan di workflow: phpunit --coverage-clover coverage/clover.xml
sonar.php.coverage.reportPaths=coverage/clover.xml
sonar.php.tests.reportPath=coverage/junit.xml

# Pipeline menunggu hasil Quality Gate; gate merah = job gagal
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Pembanding "new code": hanya kode yang berubah dari main yang dinilai ketat
sonar.newCode.referenceBranch=main
