# =============================================================================
# Axon DSS — konfigurasi Nginx (peran Infra; standar ditetapkan Security Engineer)
#
# Berkas ini adalah konfigurasi UTAMA Nginx (menggantikan /etc/nginx/nginx.conf)
# supaya seluruh kebijakan terbaca dalam satu tempat dan mudah direview.
#
# Pemetaan kontrol -> berkas kebijakan:
#   TLS-1..TLS-5 : protokol, cipher, redirect HTTP->HTTPS, HSTS, sertifikat
#   TLS-6        : terminasi TLS di sini; upstream `app:9000` tanpa published port
#   TLS-9        : tidak ada aset http:// (frontend mem-bundle seluruh aset lokal)
#   EXP-1        : hanya metode GET dan HEAD
#   EXP-3        : path sensitif ditolak (404)
#   EXP-5        : limit_req + limit_req_status 429
#   EXP-8        : server_tokens off + fastcgi_hide_header X-Powered-By
#   LOG-1..LOG-3 : access log JSON dengan field minimum, dikirim ke stdout
#
# Catatan non-root: image dijalankan sebagai USER nginx, sehingga Nginx
# mendengarkan 8080 (HTTP) dan 8443 (HTTPS). Pemetaan ke port publik 80/443
# dilakukan oleh docker-compose.yml. Seluruh direktori tulis diarahkan ke /tmp
# karena filesystem container bersifat read-only.
# =============================================================================

worker_processes auto;

pid /tmp/nginx.pid;
error_log /proc/self/fd/2 warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # EXP-8: versi Nginx tidak boleh terbaca dari header Server / halaman error
    server_tokens off;

    # --- LOG-1..LOG-3: format access log (03-logging-minimum 3.2) ------------
    # `$uri` dipakai, bukan `$request_uri`, agar query string tidak ikut tercatat.
    # Alasannya ada di 03-logging-minimum 3.3: query string bisa memuat data
    # sensitif sehingga tidak boleh masuk log.
    log_format axon_json escape=json
        '{'
            '"ts":"$time_iso8601",'
            '"ip":"$remote_addr",'
            '"req_id":"$request_id",'
            '"method":"$request_method",'
            '"path":"$uri",'
            '"status":$status,'
            '"rt":$request_time,'
            '"bytes":$bytes_sent,'
            '"ua":"$http_user_agent"'
        '}';

    # Access log ke stdout container: tidak menulis apa pun ke filesystem
    # (container read-only) dan otomatis dikumpulkan oleh Docker.
    access_log /proc/self/fd/1 axon_json;

    # --- EXP-5: pembatasan laju request (T-09) ------------------------------
    limit_req_zone $binary_remote_addr zone=axon_rl:10m rate=10r/s;
    limit_req_status 429;

    # Dashboard read-only tidak pernah menerima body besar (T-08).
    client_max_body_size 1m;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 30;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # =========================================================================
    # HTTP (:8080 di container) — hanya redirect permanen ke HTTPS (TLS-2)
    # =========================================================================
    server {
        listen      8080;
        server_name _;

        # Health check operasional milik proxy (dipakai healthcheck Compose).
        # Dikecualikan dari access log agar tidak membanjiri bukti LOG-1.
        location = /healthz {
            access_log  off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Catatan: redirect memakai $host tanpa port, sehingga mengarah ke port
        # HTTPS standar (443). Bila HTTPS_PORT di .env diubah, sesuaikan di sini.
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # HTTPS (:8443 di container) — satu-satunya pintu masuk aplikasi
    # =========================================================================
    server {
        listen      8443 ssl;
        http2       on;
        server_name _;

        # --- TLS-1, TLS-4, TLS-5 --------------------------------------------
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_tickets off;

        # --- EXP-1: dashboard read-only, hanya GET dan HEAD ------------------
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        # --- Header keamanan wajib (02-exposure-control 2.3, TLS-3) ---------
        # Semua header memakai `always` agar tetap dikirim pada respons error.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # Baseline 2.3 meminta CSP disesuaikan dengan sumber aset sebenarnya.
        # Frontend mem-bundle seluruh asetnya secara lokal (tanpa CDN), jadi CSP
        # di sini lebih ketat daripada contoh baseline: cdn.jsdelivr.net tidak
        # dibuka. Bila Developer kelak menambah aset CDN, tambahkan originnya
        # (dan atribut SRI) agar Gate T-11 tetap lolos.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        root  /usr/share/nginx/html;
        index index.html;

        # --- EXP-3: path sensitif tidak boleh dapat diakses ------------------
        location ~ /\.(?!well-known) {
            return 404;
        }
        location ~ ^/(storage|vendor|database|tests|bootstrap|node_modules)/ {
            return 404;
        }
        location ~ ^/(composer\.(json|lock)|artisan|phpunit\.xml|package(-lock)?\.json)$ {
            return 404;
        }
        location ~ ^/(telescope|horizon|_ignition|_debugbar|phpinfo\.php) {
            return 404;
        }

        # Health check operasional (tanpa rate limit, tanpa access log).
        location = /healthz {
            access_log  off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # --- /api -> php-fpm Laravel (TLS-6: upstream hanya di jaringan internal)
        location ^~ /api/ {
            limit_req zone=axon_rl burst=20 nodelay;

            include      fastcgi_params;
            fastcgi_pass app:9000;
            fastcgi_index index.php;

            # Front controller Laravel berada di container `app`, bukan di
            # container proxy. Karena itu SCRIPT_FILENAME ditulis absolut;
            # $document_root tidak bisa dipakai di sini.
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME     /index.php;
            fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
            fastcgi_param REQUEST_URI     $request_uri;
            # Ditetapkan eksplisit agar Laravel selalu melihat skema https yang
            # sebenarnya, terlepas dari versi berkas fastcgi_params bawaan image.
            fastcgi_param REQUEST_SCHEME  $scheme;
            fastcgi_param X_REQUEST_ID    $request_id;
            # EXP-8: versi software tidak diteruskan ke upstream maupun client.
            fastcgi_param SERVER_SOFTWARE nginx;

            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout 30s;
        }

        # --- Frontend SPA + aset statis --------------------------------------
        # Nginx juga berlaku sebagai reverse proxy untuk frontend (Bab 4):
        # satu origin untuk UI dan API, sehingga tidak ada CORS.
        location / {
            limit_req zone=axon_rl burst=20 nodelay;
            try_files $uri $uri/ /index.html;
        }
    }
}
