; =============================================================================
; Axon DSS — override pool php-fpm (peran Infra)
;
; Berkas ini di-include otomatis karena berada di /usr/local/etc/php-fpm.d/.
; Tidak ada kode aplikasi yang diubah di sini; semua pengaturan bersifat runtime.
; =============================================================================

[global]
; Log fpm ke stderr container agar terbaca lewat `docker compose logs` (LOG-2).
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = 0.0.0.0:9000

; WAJIB: php-fpm secara default membersihkan environment variable pekerja
; (clear_env = yes). Bila tidak dimatikan, Laravel tidak akan melihat
; DB_HOST/APP_KEY/... yang diberikan Docker Compose karena image ini tidak
; menyertakan berkas .env.
;
; Catatan: karena image dijalankan sebagai non-root (USER www-data), direktif
; `user`/`group` pada pool ini diabaikan oleh php-fpm — itu perilaku yang
; diinginkan, proses memang sudah non-root.
clear_env = no

; Batas proses sebagai mitigasi kelelahan resource / DoS (T-08, T-09).
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

catch_workers_output = yes
access.log = /proc/self/fd/2
