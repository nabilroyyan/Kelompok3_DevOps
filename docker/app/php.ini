; =============================================================================
; Axon DSS — konfigurasi PHP untuk image backend (peran Infra)
;
; Dasar kebijakan: baseline audit logging minimum (milik Security Engineer)
;   - LOG-2 : error aplikasi ditulis ke log internal, pesan ke client tetap generik
;   - 3.3   : stack trace tidak boleh bocor ke respons HTTP
; Dasar kebijakan: baseline kontrol eksposur (milik Security Engineer)
;   - EXP-8 : versi software tidak boleh terbaca dari respons (expose_php=Off)
;
; Catatan: display_errors=Off bukan satu-satunya kontrol. Laravel tetap
; dikonfigurasi APP_DEBUG=false lewat environment pada docker-compose.yml.
; =============================================================================

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
; /proc/self/fd/2 = stderr container, sehingga log ikut `docker compose logs`
; dan bisa dikumpulkan tanpa menulis ke filesystem yang read-only (LOG-2).
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED

memory_limit = 256M
max_execution_time = 30
; Dashboard hanya read-only: tidak ada unggahan berkas, jadi batas diperketat
; sebagai mitigasi penyalahgunaan resource (T-08).
upload_max_filesize = 2M
post_max_size = 2M

; Opcache: kode di dalam image bersifat immutable (tidak ada bind mount kode),
; sehingga validasi timestamp bisa dimatikan. Perubahan kode = rebuild image.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.save_comments = 1
